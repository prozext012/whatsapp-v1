<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF90E8">
<title>dixzChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" role="status"></div>
<div id="offline" hidden>OFFLINE · pesan akan dikirim saat tersambung</div>

<!-- ===== LOGIN / REGISTER ===== -->
<main id="auth" class="screen">
  <div class="logo">dixzChat</div>
  <h1 class="hero">Ngobrol tanpa basa-basi.</h1>
  <div class="tabs"><button id="tabLogin" class="chip on" type="button">LOGIN</button><button id="tabReg" class="chip" type="button">REGISTER</button></div>
  <form id="authForm" class="form" autocomplete="on">
    <div id="fUser" hidden><label for="aUser">USERNAME</label><input id="aUser" class="inp" autocapitalize="none" autocomplete="username"></div>
    <div><label for="aEmail">EMAIL</label><input id="aEmail" class="inp" type="email" autocomplete="email" required></div>
    <div><label for="aPass">PASSWORD</label><input id="aPass" class="inp" type="password" autocomplete="current-password" required minlength="6"></div>
    <div id="capBox" class="cap" hidden><div><small>BUKTIKAN KAMU MANUSIA</small><b id="capQ">5 + 7 = ?</b></div><input id="capA" class="inp" inputmode="numeric" aria-label="Jawaban captcha"></div>
    <button id="authSubmit" class="btn pink" type="submit">MASUK</button>
  </form>
</main>

<!-- ===== APLIKASI ===== -->
<div id="app" hidden>
  <section id="v-home" class="view on">
    <header class="pg"><h1>Beranda</h1></header>
    <div id="chatList" class="lst"></div>
    <div class="lab">KONTAK</div>
    <div id="homeContacts" class="lst"></div>
    <button id="fab" class="ib fab" aria-label="Chat baru"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M12 4v16M4 12h16"/></svg></button>
  </section>
  <section id="v-status" class="view"><header class="pg"><h1>Status</h1></header><div class="lst"><div class="empty">Status 24 jam hadir di ronde 2.</div></div></section>
  <section id="v-calls" class="view"><header class="pg"><h1>Telepon</h1></header><div class="lst"><div class="empty">Belum ada riwayat panggilan.</div></div></section>
  <section id="v-settings" class="view">
    <header class="pg"><h1>Pengaturan</h1></header>
    <div class="lst">
      <div class="prof"><div id="sAv"></div></div>
      <div class="card col"><label for="sName">NAMA PENGGUNA</label><input id="sName" class="inp" readonly></div>
      <div class="card col"><label for="sEmail">EMAIL</label><input id="sEmail" class="inp" readonly></div>
      <div class="card col"><label for="sBio">BIO</label><textarea id="sBio" class="inp" rows="2" maxlength="120"></textarea></div>
      <button id="sSave" class="btn pink">Simpan perubahan</button>
      <button id="sOut" class="btn white">Keluar</button>
    </div>
  </section>
  <nav class="nav" aria-label="Navigasi utama">
    <button class="ni on" data-v="home"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M3 11l9-8 9 8v10H3z"/></svg></span>Beranda</button>
    <button class="ni" data-v="status"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><circle cx="12" cy="12" r="8" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="2"/></svg></span>Status</button>
    <button class="ni" data-v="calls"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></span>Telepon</button>
    <button class="ni" data-v="settings"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span>Pengaturan</button>
  </nav>

  <!-- Sheet kontak / chat baru -->
  <div id="sheet" class="overlay" hidden>
    <div class="panel">
      <div class="pg"><h1>Chat baru</h1><button id="sClose" class="ib" aria-label="Tutup"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
      <input id="sSearch" class="inp" placeholder="Cari username" aria-label="Cari username" autocapitalize="none">
      <div id="sheetList" class="lst"></div>
      <button id="more" class="btn white" hidden>Muat lagi</button>
    </div>
  </div>

  <!-- Ruang chat -->
  <section id="room" hidden>
    <header class="rtop"><button id="rBack" class="ib" aria-label="Kembali"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M15 4L7 12l8 8"/></svg></button><div id="rAv"></div><div class="grow"><div id="rName" class="nm"></div><div id="rSub" class="sb"></div></div></header>
    <div id="msgs"></div>
    <form id="rForm" class="bar"><input id="rInput" class="inp" placeholder="Ketik pesan" aria-label="Pesan" autocomplete="off"><button class="ib pink" aria-label="Kirim"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"><path d="M3 12h16M12 5l7 7-7 7"/></svg></button></form>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
